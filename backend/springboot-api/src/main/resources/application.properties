spring.application.name=medvision-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/medvision
spring.datasource.username=medvision
spring.datasource.password=medvision_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=8080